    <script>
      function getTimestamp() {
        return new Date().getTime();
      }
    
      if (!window.location.search.includes('t=')) {
        const url = window.location.pathname + '?t=' + getTimestamp();
        window.location.replace(url);
      } else {
        const params = new URLSearchParams(window.location.search);
        const t = params.get('t');
        document.addEventListener('DOMContentLoaded', function() {
          const cssLink = document.querySelector('link[rel="stylesheet"]');
          if (cssLink) {
            cssLink.href = cssLink.href.split('?')[0] + '?t=' + t;
          }
          const configScript = document.querySelector('script[src*="config.js"]');
          if (configScript) {
            configScript.src = configScript.src.split('?')[0] + '?t=' + t;
          }
          const bioScript = document.querySelector('script[src*="biometria.js"]');
          if (bioScript) {
            bioScript.src = bioScript.src.split('?')[0] + '?t=' + t;
          }
        });
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY, {
            auth: {
                persistSession: true,
                storage: localStorage,
                autoRefreshToken: true
            }
        });

        let loginPendente = null;

        function ehCelular() {
            const ua = navigator.userAgent || '';
            if (/Android|iPhone|iPad|iPod/i.test(ua)) return true;
            if (navigator.maxTouchPoints > 1 && /Macintosh/i.test(ua)) return true;
            return false;
        }

        function mudarTela(idBloco) {
            document.querySelectorAll('.bloco').forEach(b => b.classList.remove('ativo'));
            document.getElementById(idBloco).classList.add('ativo');
            document.querySelectorAll('.mensagem-erro').forEach(msg => msg.style.display = 'none');
        }

        function normalizarCategoria(cat) {
            return (cat || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function aplicarSaudacao(nomeReal) {
            const saudacaoEl = document.getElementById('saudacao-lider');
            if (saudacaoEl && nomeReal) {
                const primeiroNome = nomeReal.split(' ')[0];
                saudacaoEl.innerText = `Graça e Paz, ${primeiroNome}`;
            }
        }

        async function verificarLogin() {
            const entrada = document.getElementById('usuario-input').value.trim().toLowerCase();
            const senhaDigitada = document.getElementById('senha-input').value.trim();
            const erro = document.getElementById('mensagem-erro');
            const btn = document.getElementById('btn-entrar');
        
            if (!entrada || !senhaDigitada) {
                erro.innerText = "⚠️ Preencha usuário/e-mail e senha.";
                erro.style.display = 'block';
                return;
            }
        
            btn.innerText = "Autenticando...";
            btn.disabled = true;
            erro.style.display = 'none';
        
            let emailParaLogin = entrada;
        
            if (!entrada.includes('@')) {
                const { data: emailEncontrado, error: rpcError } = await supabaseClient
                    .rpc('buscar_email_por_usuario', { usuario_busca: entrada });
        
                if (rpcError || !emailEncontrado) {
                    erro.innerText = "⚠️ Usuário não encontrado.";
                    erro.style.display = 'block';
                    btn.innerText = "Entrar no Sistema";
                    btn.disabled = false;
                    return;
                }
                emailParaLogin = emailEncontrado;
            }
        
            const { data: loginData, error: loginError } = await supabaseClient.auth.signInWithPassword({
                email: emailParaLogin,
                password: senhaDigitada
            });
        
            if (loginError) {
                erro.innerText = "⚠️ E-mail ou senha incorretos.";
                erro.style.display = 'block';
                document.getElementById('senha-input').value = "";
                btn.innerText = "Entrar no Sistema";
                btn.disabled = false;
                return;
            }
        
            const { data: pessoa } = await supabaseClient
                .from('pessoas')
                .select('nome, categoria, super_admin')
                .eq('email', emailParaLogin)
                .maybeSingle();

            if (!pessoa) {
                erro.innerText = "⚠️ Registro não encontrado na base de dados.";
                erro.style.display = 'block';
                btn.innerText = "Entrar no Sistema";
                btn.disabled = false;
                return;
            }

            const nomeReal = pessoa.nome;
            const categoriaNormalizada = normalizarCategoria(pessoa.categoria);

            if (pessoa.super_admin === true) {
                registrarLog(entrada, nomeReal, "Fez login (super admin)");
                gravarSessaoLocal(nomeReal, emailParaLogin, 'superadmin', ['superadmin']);
                window.location.href = 'superadmin.html';
                return;
            }

            if (categoriaNormalizada !== 'administrador') {
                registrarLog(entrada, nomeReal, "Fez login no sistema");
            }

            const paginas = paginasPorCategoria(categoriaNormalizada);
            gravarSessaoLocal(nomeReal, emailParaLogin, categoriaNormalizada, paginas);
            if (window.VideiraPush) VideiraPush.ativar(supabaseClient);
            aplicarSaudacao(nomeReal);

            const podeBio = ehCelular() && await Biometria.plataformaDisponivel();
            if (podeBio && !Biometria.cadastradaPara(emailParaLogin)) {
                loginPendente = {
                    nome: nomeReal,
                    email: emailParaLogin,
                    userId: loginData.user && loginData.user.id,
                    paginas: paginas,
                    categoria: categoriaNormalizada
                };
                mudarTela('bloco-biometria');
                btn.innerText = "Entrar no Sistema";
                btn.disabled = false;
                return;
            }

            seguirParaPaineis(nomeReal, paginas);
        }

        function paginasPorCategoria(categoriaNormalizada) {
            if (categoriaNormalizada === 'administrador') {
                return [
                    { nome: "Painel Admin", url: "admin" },
                    { nome: "Painel Pastoral", url: "pastor" },
                    { nome: "Painel Discipulador", url: "discipulador" },
                    { nome: "Painel do Líder", url: "lider" }
                ];
            }
            if (['pastor de governo', 'pastor de rede', 'pastor'].includes(categoriaNormalizada)) {
                return [{ nome: "Painel Pastoral", url: "pastor" }];
            }
            if (categoriaNormalizada === 'discipulador') {
                return [{ nome: "Painel Discipulador", url: "discipulador" }];
            }
            if (categoriaNormalizada === 'líder' || categoriaNormalizada === 'lider') {
                return [{ nome: "Painel do Líder", url: "lider" }];
            }
            if (categoriaNormalizada === 'tesoureiro') {
                return [
                    { nome: "Financeiro PC", url: "financeiro" },
                    { nome: "Financeiro Mobile", url: "financeiromobile" }
                ];
            }
            return [{ nome: "Área do Membro", url: "membro" }];
        }

        function gravarSessaoLocal(nomeReal, email, categoria, paginas) {
            sessionStorage.setItem('usuarioLogado', nomeReal);
            sessionStorage.setItem('loginDigitado', email);
            sessionStorage.setItem('urlApi', urlBackend);
            sessionStorage.setItem('categoria', categoria);
            sessionStorage.setItem('paginasPermitidas', JSON.stringify(paginas.map(p => p.url)));
        }

        function seguirParaPaineis(nomeReal, paginas) {
            if (paginas.length === 1) {
                entrarNoPainel(nomeReal, paginas[0].url);
                return;
            }

            mudarTela('bloco-login');
            document.getElementById('area-form').style.display = 'none';
            document.getElementById('area-escolha').style.display = 'block';
            document.getElementById('titulo-login').innerText = `Olá, ${nomeReal}`;
            document.getElementById('subtitulo-login').innerText = "Escolha o painel:";

            const divBotoes = document.getElementById('botoes-painel');
            divBotoes.innerHTML = '';
            paginas.forEach(pag => {
                let b = document.createElement('button');
                b.innerText = pag.nome;
                b.onclick = () => entrarNoPainel(nomeReal, pag.url);
                divBotoes.appendChild(b);
            });
        }

        async function ativarBiometria() {
            const erro = document.getElementById('mensagem-erro-bio');
            const btn = document.getElementById('btn-ativar-bio');
            if (!loginPendente) {
                mudarTela('bloco-login');
                return;
            }

            btn.disabled = true;
            btn.innerText = "Validando Segurança...";
            erro.style.display = 'none';

            try {
                await Biometria.registrar({
                    userId: loginPendente.userId,
                    email: loginPendente.email,
                    nome: loginPendente.nome
                });
                const pendente = loginPendente;
                loginPendente = null;
                seguirParaPaineis(pendente.nome, pendente.paginas);
            } catch (e) {
                erro.innerText = e.name === 'NotAllowedError'
                    ? "Registro cancelado. Você pode tentar de novo ou pular."
                    : ("Não foi possível ativar: " + (e.message || e));
                erro.style.display = 'block';
                btn.disabled = false;
                btn.innerText = "Ativar agora";
            }
        }

        function pularBiometria() {
            if (!loginPendente) {
                mudarTela('bloco-login');
                return;
            }
            const pendente = loginPendente;
            loginPendente = null;
            seguirParaPaineis(pendente.nome, pendente.paginas);
        }

        async function loginComBiometria() {
            const erro = document.getElementById('mensagem-erro');
            const btn = document.getElementById('btn-biometria');
            erro.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "Validando Segurança...";

            try {
                const cadastro = await Biometria.autenticar();
                const { data: { user } } = await supabaseClient.auth.getUser();

                if (!user || (user.email || '').toLowerCase() !== (cadastro.email || '').toLowerCase()) {
                    Biometria.removerCadastro();
                    throw new Error("Sessão expirada. Entre com usuário e senha e ative a biometria de novo.");
                }

                const { data: pessoa } = await supabaseClient
                    .from('pessoas')
                    .select('nome, categoria, super_admin')
                    .eq('email', cadastro.email)
                    .maybeSingle();

                if (!pessoa) throw new Error("Registro não encontrado na base de dados.");

                const nomeReal = pessoa.nome;
                const categoriaNormalizada = normalizarCategoria(pessoa.categoria);

                if (pessoa.super_admin === true) {
                    registrarLog(cadastro.email, nomeReal, "Fez login (super admin)");
                    gravarSessaoLocal(nomeReal, cadastro.email, 'superadmin', ['superadmin']);
                    window.location.href = 'superadmin.html';
                    return;
                }

                const paginas = paginasPorCategoria(categoriaNormalizada);

                if (categoriaNormalizada !== 'administrador') {
                    registrarLog(cadastro.email, nomeReal, "Fez login com biometria");
                }
                gravarSessaoLocal(nomeReal, cadastro.email, categoriaNormalizada, paginas);
                if (window.VideiraPush) VideiraPush.ativar(supabaseClient);
                aplicarSaudacao(nomeReal);
                seguirParaPaineis(nomeReal, paginas);
            } catch (e) {
                erro.innerText = e.name === 'NotAllowedError'
                    ? "Leitura cancelada. Tente de novo ou entre com a senha."
                    : ("⚠️ " + (e.message || "Falha na biometria."));
                erro.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "Entrar com Biometria";
            }
        }

        function desativarBiometria() {
            Biometria.removerCadastro();
            atualizarBotoesBiometria();
        }

        async function atualizarBotoesBiometria() {
            const btnBio = document.getElementById('btn-biometria');
            const btnRemover = document.getElementById('btn-remover-bio');
            const ok = ehCelular() && await Biometria.plataformaDisponivel();
            const tem = Biometria.temCadastro();
            if (btnBio) btnBio.style.display = (ok && tem) ? 'block' : 'none';
            if (btnRemover) btnRemover.style.display = (ok && tem) ? 'block' : 'none';
        }

        atualizarBotoesBiometria().then(function () {
            if (ehCelular() && Biometria.temCadastro()) loginComBiometria();
        });
        
        function entrarNoPainel(nome, urlDestino) {
            const telaLogin = document.getElementById('tela-login');
            const splashScreen = document.getElementById('splash-screen');
            document.getElementById('splash-texto').innerText = `Carregando...`;

            telaLogin.style.opacity = '0'; 
            setTimeout(() => {
                telaLogin.style.display = 'none';
                splashScreen.style.display = 'flex';
                setTimeout(() => splashScreen.style.opacity = '1', 10);
                setTimeout(() => {
                    window.location.href = urlDestino + ".html?t=" + Date.now();
                }, 1000);
            }, 400);
        }

        async function registrarLog(usuarioDigitado, nomeReal, acaoRealizada) {
            const dataHoraAtual = new Date().toISOString();
            try {
                await supabaseClient.from('logs').insert([{
                    datahora: dataHoraAtual,
                    usuario: usuarioDigitado,
                    nomelider: nomeReal,
                    acao: acaoRealizada
                }]);
            } catch (e) {
                console.error("Erro ao registrar log:", e);
            }
        }

        function sair() {
            sessionStorage.clear();
            document.getElementById('area-escolha').style.display = 'none';
            document.getElementById('area-form').style.display = 'block';
            document.getElementById('titulo-login').innerText = "Bem-vindo(a)";
            document.getElementById('subtitulo-login').innerText = "Acesse o seu painel";
            document.getElementById('usuario-input').value = "";
            document.getElementById('senha-input').value = "";
            document.getElementById('btn-entrar').innerText = "Entrar no Sistema";
            document.getElementById('btn-entrar').disabled = false;
            atualizarBotoesBiometria();
        }

        async function enviarRecuperacao() {
            const email = document.getElementById('rec-email').value.trim();
            const btn = document.getElementById('btn-recuperar');
            const erro = document.getElementById('mensagem-erro-rec');

            if (!email) {
                erro.innerText = "⚠️ Informe seu e-mail cadastrado.";
                erro.style.display = 'block';
                return;
            }

            btn.innerText = "Processando...";
            btn.disabled = true;
            erro.style.display = 'none';

            try {
                const urlDestino = new URL('nova-senha.html', window.location.href).href;
                const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: urlDestino,
                });
                if (error) throw error;

                UI.toast("E-mail de recuperação enviado! Verifique sua caixa de entrada.", { tipo: 'sucesso' });
                registrarLog(email, "Solicitou Recuperação de Senha");
                document.getElementById('rec-email').value = "";
                mudarTela('bloco-login');
            } catch (e) {
                erro.innerText = "⚠️ Erro: " + e.message;
                erro.style.display = 'block';
            } finally {
                btn.innerText = "Enviar Link";
                btn.disabled = false;
            }
        }

        function verificarEnter(event, contexto) { 
            if (event.key === "Enter") {
                if(contexto === 'login') verificarLogin();
                else if(contexto === 'recuperar') enviarRecuperacao();
            } 
        }
    </script>
    <script src="js/pwa.js"></script>
</body>
</html>
